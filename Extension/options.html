<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>速下扩展设置</title>
  <style>
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      max-width: 560px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1d1d1f;
      background: #fafafa;
    }
    h1 { font-size: 20px; }
    h2 { font-size: 15px; margin-top: 26px; }
    .card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      padding: 16px 18px;
      margin-top: 10px;
    }
    label.block { display: block; margin: 8px 0; }
    input[type="radio"] { margin-right: 6px; }
    textarea {
      width: 100%;
      height: 90px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      margin-top: 18px;
      padding: 8px 22px;
      border: none;
      border-radius: 8px;
      background: #2e9e44;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    #saved { color: #2e9e44; margin-left: 10px; font-size: 13px; }
    .hint { font-size: 12px; color: #888; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>速下扩展设置</h1>

  <div class="card">
    <h2>接管方式</h2>
    <label class="block"><input type="radio" name="mode" value="auto"> 自动接管：浏览器下载自动交给速下</label>
    <label class="block"><input type="radio" name="mode" value="ask"> 每次询问：出现下载时弹窗询问</label>
    <label class="block"><input type="radio" name="mode" value="off"> 关闭接管：不拦截任何下载</label>
  </div>

  <div class="card">
    <h2>接管范围</h2>
    <label class="block"><input type="radio" name="filter" value="all"> 所有文件</label>
    <label class="block"><input type="radio" name="filter" value="media"> 仅媒体与安装包（视频/音频/压缩包等）</label>
  </div>

  <div class="card">
    <h2>排除站点</h2>
    <textarea id="excluded" placeholder="每行一个域名，例如：&#10;drive.google.com&#10;github.com"></textarea>
    <div class="hint">这些域名下的下载不会被接管。</div>
  </div>

  <div>
    <button id="save">保存设置</button>
    <span id="saved"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
